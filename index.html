                            <label for="idea-text" class="block text-sm font-semibold text-gray-900 mb-2">Tell us about it</label>
                            <textarea id="idea-text" oninput="app.idea.text = this.value" maxlength="3000" rows="7" placeholder="What were you trying to do, and what would have made it easier?" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-600 resize-none">${app.idea.text}</textarea>
                            <p class="text-xs text-gray-400 mt-1 text-right">${app.idea.text.length}/3000</p>

                            <p class="text-xs text-gray-500 mt-3 mb-4">We'll reply to <strong>${app.user.email}</strong> if a question comes up.</p>

                            <button onclick="submitIdea()" ${app.idea.sending ? 'disabled' : ''} class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700 disabled:opacity-50">
                                ${app.idea.sending ? 'Sending\u2026' : 'Send it'}
                            </button>
                        </div>

                        <div class="bg-white rounded-2xl border border-gray-200 p-6 text-sm text-gray-600">
                            <p class="mb-2 font-semibold text-gray-900">Especially useful to hear about</p>
                            <p class="mb-1">\u2022 A step that took longer than it should have</p>
                            <p class="mb-1">\u2022 Anywhere the theology came out wrong for your tradition</p>
                            <p class="mb-1">\u2022 Something you still do by hand after using GraceTools</p>
                            <p>\u2022 A tool you'd pay for that doesn't exist yet</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function SupportPage() {
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-4xl font-bold text-gray-900 mb-2">Support</h1>
                        <p class="text-gray-600 mb-8">Have a question? Send us a message and we'll respond within 24 hours.</p>

                        <div class="bg-white rounded-2xl border border-gray-200 p-8 mb-6">
                            <div style="position: absolute; left: -9999px;" aria-hidden="true">
                                <label for="contact-website">Website (leave this blank)</label>
                                <input id="contact-website" type="text" tabindex="-1" autocomplete="off" />
                            </div>
                            <div class="mb-4">
                                <label for="contact-name" class="block text-sm font-semibold text-gray-900 mb-2">Name</label>
                                <input id="contact-name" type="text" placeholder="Your name" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-600" />
                            </div>
                            <div class="mb-4">
                                <label for="contact-email" class="block text-sm font-semibold text-gray-900 mb-2">Email</label>
                                <input id="contact-email" type="email" placeholder="you@church.com" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-600" />
                            </div>
                            <div class="mb-4">
                                <label for="contact-message" class="block text-sm font-semibold text-gray-900 mb-2">Message</label>
                                <textarea id="contact-message" maxlength="3000" rows="5" placeholder="How can we help?" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-purple-600 resize-none"></textarea>
                            </div>
                            <button onclick="submitContactForm()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700">Send Message</button>
                        </div>

                        <div class="bg-white rounded-2xl border border-gray-200 p-6 text-sm text-gray-600">
                            <p class="mb-2"><strong>Email:</strong> support@gracetools.com</p>
                            <p><strong>Response Time:</strong> Within 24 hours</p>
                        </div>

                        <p class="text-center text-gray-600 text-sm mt-6">Looking for quick answers? <button type="button" onclick="goTo('faq')" class="text-purple-600 hover:underline font-semibold cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Check our FAQ</button></p>
                    </div>
                </div>
            `;
        }

        function HowItWorksPage() {
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12">
                    <div class="max-w-3xl mx-auto">
                        <h1 class="text-4xl font-bold text-gray-900 mb-2">How It Works</h1>
                        <p class="text-gray-600 mb-10">From a starting point to a complete, doctrine-aware sermon — here's the full process.</p>

                        <div class="space-y-6">
                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">1. Choose your package</h2>
                                <p class="text-gray-600 text-sm mb-2"><strong>Essentials</strong> — title, big idea, main points, and key takeaways.</p>
                                <p class="text-gray-600 text-sm mb-2"><strong>Preacher</strong> — everything in Essentials, plus a full introduction, historical and cultural background, cross-references, and conclusion.</p>
                                <p class="text-gray-600 text-sm"><strong>Master Sermon</strong> — everything in Preacher, plus verse-by-verse commentary, character studies, a children's message, and discussion questions.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">2. Give it a starting point</h2>
                                <p class="text-gray-600 text-sm">Type a Bible passage, a topic, or your own rough notes — or upload a PDF (we extract the text) or an audio recording (we transcribe it). Six ways in, one sermon out.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">3. Set your theological framework</h2>
                                <p class="text-gray-600 text-sm">Choose your doctrinal position, Bible translation, audience/occasion, reading level, and how Scripture gets cited (reference only, or full verse text). Every generation is shaped by what you pick here — it's not just decoration.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">4. Add what you need</h2>
                                <p class="text-gray-600 text-sm">Youth Version, Small Group Guide, Blog Article, Social Posts, Discussion Questions, Printable Handout — plus YouTube Title & Thumbnail, Description, Tags, Chapters, and Hook if you post your messages online. Add a Fact Checker pass for extra peace of mind.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">5. Check out with credits</h2>
                                <p class="text-gray-600 text-sm">Credits never expire. If a generation ever fails, you're refunded automatically — you only pay for sermons you actually receive.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">6. It lands in your inbox</h2>
                                <p class="text-gray-600 text-sm">Most sermons generate and arrive by email in under a minute. Add-ons that need extra passes may take a little longer.</p>
                            </div>

                            <div class="bg-white rounded-2xl border border-gray-200 p-6">
                                <h2 class="font-bold text-gray-900 mb-2">Also available: Quick Tools</h2>
                                <p class="text-gray-600 text-sm">Need something smaller than a full sermon? Quick Tools gives you 20 standalone generators — verse explanations, cross-references, word studies, devotionals, church announcements, and more — for 2 credits each.</p>
                            </div>
                        </div>

                        <div class="text-center mt-10">
                            <button onclick="goTo('${app.isLoggedIn ? 'builder' : 'signup'}')" class="bg-purple-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-purple-700">Start a Sermon</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function FAQPage() {
            const faqs = [
                { q: 'What theological framework does GraceTools use?', a: 'You choose. Select your doctrinal position \u2014 Roman Catholic, Eastern Orthodox, Anglican, Lutheran, Reformed, Baptist, Methodist, Pentecostal / Charismatic, Non-Denominational Evangelical, Acts 2 Dispensational, or Mid-Acts Dispensational \u2014 and the AI frames the passage, its audience, and its application accordingly. You can set this in the sermon builder and again in Quick Tools. Always review the result against your own tradition before preaching it.' },
                { q: 'Do credits expire?', a: 'No. Credits you purchase never expire — use them whenever you need them.' },
                { q: 'What if a sermon fails to generate?', a: "If generation fails for any reason, your credits are automatically refunded in full — you're never charged for a failed attempt." },
                { q: 'Can I upload my own notes, a PDF, or an audio recording?', a: 'Yes. The builder supports typed text, a Bible passage or topic, a YouTube link, an uploaded PDF (we extract the text), or an uploaded audio file (we transcribe it for you).' },
                { q: 'What is the Fact Checker?', a: "It's an optional add-on that runs a second AI pass over your generated sermon, checking scripture accuracy, flagging any fabricated claims, and confirming doctrinal consistency. It only flags concerns for your review — it never rewrites anything automatically." },
                { q: 'What Bible translations are supported?', a: 'KJV, NASB, NKJV, ESV, and NIV are currently available in the builder.' },
                { q: 'Can I control how AI quotes Scripture?', a: 'Yes — choose "Reference Only" (just the verse address) or "Full Verse Text" (the complete quoted text) in the builder.' },
                { q: 'How long does generation take?', a: 'Most sermons generate and arrive by email within 30-90 seconds.' },
                { q: 'Is my data private?', a: "See our Privacy Policy for full details — in short, your content is used to generate your sermon and is not shared publicly." },
                { q: "What's the difference between Essentials, Preacher, and Master packages?", a: 'Essentials includes a title, big idea, main points, and key takeaways. Preacher adds a full introduction, historical/cultural background, cross-references, and conclusion. Master adds verse-by-verse commentary, character studies, a children\'s message, and discussion questions.' }
            ];
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-4xl font-bold text-gray-900 mb-8">Frequently Asked Questions</h1>
                        <div class="space-y-4">
                            ${faqs.map((f, i) => `
                                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                                    <button onclick="app.faqOpen = app.faqOpen === ${i} ? null : ${i}; render();" class="w-full text-left px-6 py-4 flex items-center justify-between">
                                        <span class="font-semibold text-gray-900">${f.q}</span>
                                        <span class="text-purple-600 text-xl">${app.faqOpen === i ? '\u2212' : '+'}</span>
                                    </button>
                                    ${app.faqOpen === i ? `<div class="px-6 pb-4 text-gray-600 text-sm leading-relaxed">${f.a}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-center text-gray-600 text-sm mt-8">Still have questions? <button type="button" onclick="goTo('support')" class="text-purple-600 hover:underline font-semibold cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Contact us</button></p>
                    </div>
                </div>
            `;
        }

        function NotFoundPage() {
            trackEvent('page_not_found', { page: app.currentPage });
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12 flex items-center justify-center">
                    <div class="max-w-md mx-auto text-center">
                        <p class="text-6xl mb-4">\ud83e\udded</p>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Page Not Found</h1>
                        <p class="text-gray-600 mb-8">We couldn't find what you were looking for. It may have moved, or the link might be out of date.</p>
                        <button onclick="goToLogoHome()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700">${app.isLoggedIn ? 'Back to Dashboard' : 'Back to Home'}</button>
                    </div>
                </div>
            `;
        }

        // Render
        function render() {
            let content = '';
            
            if (app.currentPage === 'home') content = HomePage();
            else if (app.currentPage === 'signup') content = app.isLoggedIn ? '' : SignupPage();
            else if (app.currentPage === 'login') content = app.isLoggedIn ? '' : LoginPage();
            else if (app.currentPage === 'forgot-password') content = ForgotPasswordPage();
            else if (app.currentPage === 'reset-password') content = ResetPasswordPage();
            else if (app.currentPage === 'dashboard') content = app.isLoggedIn ? DashboardPage() : HomePage();
            else if (app.currentPage === 'sermon-viewer') content = app.isLoggedIn ? SermonViewerPage() : HomePage();
            else if (app.currentPage === 'generating') content = app.isLoggedIn ? GeneratingPage() : HomePage();
            else if (app.currentPage === 'quick-tools') content = app.isLoggedIn ? QuickToolsPage() : HomePage();
            else if (app.currentPage === 'repurpose') content = app.isLoggedIn ? RepurposePage() : HomePage();
            else if (app.currentPage === 'pricing') content = PricingPage();
            else if (app.currentPage === 'builder') content = app.isLoggedIn ? BuilderPage() : SignupPage();
            else if (app.currentPage === 'about') content = PricingPageComplete();
            else if (app.currentPage === 'terms') content = TermsPage();
            else if (app.currentPage === 'privacy') content = PrivacyPage();
            else if (app.currentPage === 'legal') content = LegalPage();
            else if (app.currentPage === 'account') content = app.isLoggedIn ? AccountPage() : HomePage();
            else if (app.currentPage === 'checkout') content = app.isLoggedIn ? CheckoutPage() : HomePage();
            else if (app.currentPage === 'how-it-works') content = HowItWorksPage();
            else if (app.currentPage === 'support') content = SupportPage();
            else if (app.currentPage === 'ideas') content = app.isLoggedIn ? IdeasPage() : SupportPage();
            else if (app.currentPage === 'faq') content = FAQPage();
            else content = NotFoundPage();

            // Replacing innerHTML resets scroll and focus. Preserve both so typing
            // in a field or re-rendering on a timer doesn't yank the page around.
            // Exception: if a flash message is about to be shown, it renders at the
            // very top of the page. Preserving scroll in that case leaves the banner
            // off-screen above the user's current position - the message technically
            // exists in the DOM but is invisible, which looks exactly like "nothing
            // happened" after a form submit. So when there's a flash to show, we
            // scroll to top instead of preserving position.
            const _scrollY = window.scrollY;
            const _activeId = document.activeElement ? document.activeElement.id : null;
            const _selStart = document.activeElement && document.activeElement.selectionStart;
            const _hasFlashToShow = !!app.flash;

            // Panels with their own scrollbar (the Quick Tools list) lose their
            // position when innerHTML is replaced, so picking a tool near the
            // bottom snapped the list back to the top. Remember each panel's
            // position and put it back.
            const _panelScroll = {};
            document.querySelectorAll('[data-keep-scroll]').forEach(function (el) {
                _panelScroll[el.getAttribute('data-keep-scroll')] = el.scrollTop;
            });

            document.getElementById('app').innerHTML = Header() + FlashBanner() + content + `
                <footer class="bg-white border-t border-gray-200 px-6 py-8 mt-12">
                    <div class="max-w-7xl mx-auto text-center text-sm text-gray-600">
                        <div class="mb-4 space-x-4">
                            <button type="button" onclick="goTo('legal')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Legal</button>
                            <button type="button" onclick="goTo('terms')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Terms</button>
                            <button type="button" onclick="goTo('privacy')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Privacy</button>
                            <button type="button" onclick="goTo('support')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Support</button>
                            <button type="button" onclick="goTo('faq')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">FAQ</button>
                            <button type="button" onclick="goTo('ideas')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Ideas</button>
                        </div>
                        <p>© 2024 GraceTools. Built for pastors.</p>
                    </div>
                </footer>
            `;

            // Restore inner panel positions regardless of the page-level scroll
            // decision below - a flash banner is no reason to reset a side list.
            document.querySelectorAll('[data-keep-scroll]').forEach(function (el) {
                const saved = _panelScroll[el.getAttribute('data-keep-scroll')];
                if (typeof saved === 'number') el.scrollTop = saved;
            });

            if (_hasFlashToShow) {
                window.scrollTo(0, 0);
            } else {
                window.scrollTo(0, _scrollY);
                if (_activeId) {
                    const el = document.getElementById(_activeId);
                    if (el) {
                        el.focus();
                        if (typeof _selStart === 'number' && el.setSelectionRange) {
                            try { el.setSelectionRange(_selStart, _selStart); } catch (e) {}
                        }
                    }
                }
            }
        }

        // Init
        // Trust the stored session, not the isLoggedIn flag - that flag was
        // just a localStorage boolean anyone could set by hand.
        (function () {
            const s = getSession();
            if (!s || !s.access_token) {
                app.isLoggedIn = false;
                localStorage.removeItem('isLoggedIn');
            }
        })();

        // Must run before the first render so a pastor arriving from a reset
        // email lands on the "set a new password" page instead of the homepage.
        detectPasswordRecovery();

        render();

        // Keep the token fresh in the background so a long sermon session
        // doesn't expire mid-generation.
        refreshSessionIfNeeded();
        setInterval(refreshSessionIfNeeded, 10 * 60 * 1000);

        // Credits change server-side the moment Stripe confirms payment, which
        // is entirely outside this page's control. Refresh on load (catches
        // Stripe redirecting back here after checkout) and whenever the tab
        // regains focus (catches paying in a second tab, then switching back)
        // so the credit count on screen never sits stale.
        if (app.isLoggedIn) refreshAccount();
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && app.isLoggedIn) refreshAccount();
        });
    </script>
</body>
</html>
