<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // State Management
        const app = {
            currentPage: 'home',
            isLoggedIn: localStorage.getItem('isLoggedIn') === 'true',
            user: localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : { name: 'Pastor John', email: 'pastor@church.com', church: 'Grace Baptist', credits: 1250 },
            sermonState: {
                package: 'essentials',
                duration: 30,
                addons: [],
                inputType: 'passage',
                inputContent: '',
                translation: 'KJV',
                audience: 'Sunday Morning - Mixed',
                doctrinalPosition: 'Non-Denominational Evangelical',
                readingLevel: 'Standard',
                citationMode: 'Reference Only'
            },
            flash: null
        };

        const packagePrices = { essentials: 15, preacher: 35, master: 65 };
        const addonPrices = { 'Youth Version': 8, 'Small Group Guide': 10, 'Blog Article': 6, 'Social Posts': 5, 'Discussion Questions': 7, 'Printable': 5 };
        const youtubeAddonPrices = { 'YouTube Title & Thumbnail Ideas': 5, 'YouTube Description': 4, 'YouTube Tags': 2, 'YouTube Chapters': 4, 'YouTube Hook': 3 };
        const FACT_CHECKER_PRICE = 0;
        const ALL_ADDON_PRICES = { ...addonPrices, ...youtubeAddonPrices, 'Fact Checker': FACT_CHECKER_PRICE };

        const inputTypes = [
            { key: 'passage', label: 'Bible Passage', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'topic', label: 'Topic', placeholder: 'e.g. Walking in grace during suffering' },
            { key: 'notes', label: 'My Notes', placeholder: 'Paste your rough notes or outline here...' },
            { key: 'youtube', label: 'YouTube Link', placeholder: 'https://youtube.com/watch?v=...' },
            { key: 'pdf', label: 'Upload PDF', placeholder: '' },
            { key: 'audio', label: 'Upload Audio', placeholder: '' }
        ];
        const translations = ['KJV', 'NASB', 'NKJV', 'ESV', 'NIV'];
        const audiences = ['Sunday Morning - Mixed', 'Youth Service', 'Small Group / Bible Study', 'Funeral / Memorial', 'Wedding', "Men's / Women's Ministry"];
        const doctrinalPositions = ['Roman Catholic', 'Eastern Orthodox', 'Anglican', 'Lutheran', 'Reformed', 'Baptist', 'Methodist', 'Pentecostal / Charismatic', 'Non-Denominational Evangelical', 'Acts 2 Dispensational', 'Mid-Acts Dispensational'];
        const readingLevels = ['Simple / Accessible', 'Standard', 'Scholarly / Academic'];
        const citationModes = ['Reference Only', 'Full Verse Text'];
        const packageRecommendedDuration = { essentials: [15, 30], preacher: [30, 45, 60], master: [45, 60, 90] };
        const packageRecommendedAddons = {
            essentials: ['Discussion Questions', 'Printable'],
            preacher: ['Discussion Questions', 'Printable', 'Small Group Guide', 'Blog Article'],
            master: ['Youth Version', 'Small Group Guide', 'Blog Article', 'Social Posts', 'Discussion Questions', 'Printable']
        };

        // Navigation
        const TRACK_EVENT_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/track-event';

        function trackEvent(action, extra) {
            // Fire-and-forget - never let analytics failures affect the user experience
            try {
                gtFetch(TRACK_EVENT_WEBHOOK_URL, { action, user_id: localStorage.getItem('userId') || null, ...extra }).catch(() => {});
            } catch (e) {}
        }

        // Capture real client-side JS errors so we actually find out when
        // something breaks for a real user, instead of hearing about it secondhand.
        window.onerror = function (message, source, lineno, colno, error) {
            trackEvent('js_error', {
                page: app.currentPage,
                error_message: String(message),
                error_stack: error && error.stack ? error.stack : (source + ':' + lineno + ':' + colno)
            });
            return false;
        };
        window.addEventListener('unhandledrejection', function (event) {
            trackEvent('js_error', {
                page: app.currentPage,
                error_message: 'Unhandled promise rejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)),
                error_stack: event.reason && event.reason.stack ? event.reason.stack : ''
            });
        });

        const PAGE_TITLES = {
            home: 'GraceTools - AI Sermon Prep for Pastors',
            signup: 'Create Account - GraceTools',
            login: 'Sign In - GraceTools',
            'reset-password': 'Set a New Password - GraceTools',
            dashboard: 'Dashboard - GraceTools',
            builder: 'Build a Sermon - GraceTools',
            pricing: 'Pricing - GraceTools',
            'quick-tools': 'Quick Tools - GraceTools',
            'how-it-works': 'How It Works - GraceTools',
            support: 'Support - GraceTools',
            ideas: 'Share an Idea - GraceTools',
            faq: 'FAQ - GraceTools',
            about: 'About - GraceTools',
            terms: 'Terms of Service - GraceTools',
            privacy: 'Privacy Policy - GraceTools',
            legal: 'Legal Notices - GraceTools',
            account: 'Account Settings - GraceTools'
        };

        function goTo(page) {
            app.currentPage = page;
            window.scrollTo(0, 0);
            document.title = PAGE_TITLES[page] || 'GraceTools';
            render();
            trackEvent('pageview', { page });
            if (page === 'dashboard' && app.isLoggedIn) {
                loadProjects();
                refreshAccount();
            }
        }

        // Flash messages survive exactly one render (including through a goTo
        // that immediately follows setFlash), then clear themselves on the
        // next render so they don't linger across unrelated navigation.
        function setFlash(type, text) {
            app.flash = { type, text, shown: false };
        }

        // Every account, real or returning, is created/looked-up through this
        // one webhook, which upserts into the real Supabase users table and
        // always returns the canonical row (real id + real credits_balance).
        // This is what completeCheckout's credit deduction depends on.
        const CREATE_USER_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/create-user';

        // Transactional emails (welcome, sermon submitted, password reset).
        // Fire-and-forget on purpose: a mail failure must never block signup or
        // stop a sermon from generating. Failures are logged, not surfaced.
        const SEND_NOTIFICATION_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/send-notification';

        function sendNotification(type, fields) {
            try {
                gtFetch(SEND_NOTIFICATION_WEBHOOK_URL, { type, ...fields }).catch(function (e) {
                    trackEvent('notification_failed', { notification_type: type, error_message: String(e && e.message || e) });
                });
            } catch (e) {}
        }

        // Shared key required by every GraceTools webhook. Note: since this
        // ships in client-side JS, a determined attacker could still extract
        // it from the page source - this stops casual scraping/enumeration
        // but is not a substitute for real per-user session authentication.
        // --- Supabase Auth -------------------------------------------------
        // The anon key is designed to be public; it grants nothing on its own.
        // Real identity comes from the session token issued after a password
        // login, which the server verifies. The browser never gets to assert
        // who it is.
        const SUPABASE_URL = 'https://fordopghwdjwmoeziehb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvcmRvcGdod2Rqd21vZXppZWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NjAyNDIsImV4cCI6MjEwMDMzNjI0Mn0.UmAl_tR-oJ9nMkfowp4NX-XF3f5ut5UqFZ7xFnKPcWk';

        function getSession() {
            try { return JSON.parse(localStorage.getItem('gt_session') || 'null'); }
            catch (e) { return null; }
        }
        function setSession(s) {
            if (s) localStorage.setItem('gt_session', JSON.stringify(s));
            else localStorage.removeItem('gt_session');
        }

        // Every webhook call goes through here so the session token is attached
        // in one place and can never be forgotten on a new endpoint.
        async function gtFetch(url, body) {
            const session = getSession();
            const headers = { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY };
            if (session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
            return fetch(url, { method: 'POST', headers, body: JSON.stringify(body || {}) });
        }

        async function supabaseAuth(path, payload) {
            const res = await fetch(SUPABASE_URL + '/auth/v1' + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(data.error_description || data.msg || data.message || ('Authentication failed (' + res.status + ')'));
            }
            return data;
        }

        // Access tokens expire after an hour. Refresh silently so a pastor
        // mid-sermon isn't thrown back to the login screen.
        async function refreshSessionIfNeeded() {
            const s = getSession();
            if (!s || !s.refresh_token) return null;
            if (s.expires_at && Date.now() < (s.expires_at - 120) * 1000) return s;
            try {
                const data = await supabaseAuth('?grant_type=refresh_token', { refresh_token: s.refresh_token });
                setSession(data);
                return data;
            } catch (e) {
                setSession(null);
                return null;
            }
        }

        const GRACETOOLS_API_KEY = 'WtESSNN3F8YgGRLcwn0I3-UpOUFSgu_h97w2gJ-hLdU';

        function applyAccountFromServer(serverUser, fallbackName, fallbackChurch) {
            app.user = {
                name: serverUser.display_name || fallbackName || app.user.name,
                email: serverUser.email,
                church: serverUser.church_name || fallbackChurch || app.user.church,
                credits: typeof serverUser.credits_balance === 'number' ? serverUser.credits_balance : 0
            };
            app.isLoggedIn = true;
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('user', JSON.stringify(app.user));
            localStorage.setItem('userId', serverUser.id);
        }

        // Credits are added server-side the moment Stripe confirms a payment -
        // the browser has no idea that happened. Without this, the credit count
        // shown on screen is whatever was cached at last login, and stays wrong
        // until the user logs out and back in. This webhook is safe to call for
        // an existing account - it just re-fetches their current row, it doesn't
        // create a duplicate or reset anything.
        let accountRefreshInFlight = false;
        async function refreshAccount() {
            if (!app.isLoggedIn || accountRefreshInFlight) return;
            accountRefreshInFlight = true;
            try {
                const res = await gtFetch(CREATE_USER_WEBHOOK_URL, { user_id: ensureUserId(), email: app.user.email });
                if (!res.ok) return;
                const data = await res.json();
                if (data && data.user) {
                    const before = app.user.credits;
                    applyAccountFromServer(data.user, app.user.name, app.user.church);
                    if (app.user.credits !== before) render();
                }
            } catch (e) {
                // Silent - this is a background refresh, not a user action. A failed
                // refresh just means we keep showing the last known credit balance.
            } finally {
                accountRefreshInFlight = false;
            }
        }

        // Show an error directly inside the signup/login box, right above the
        // submit button. The top-of-page flash banner can end up scrolled out of
        // view, which makes a failed login look like nothing happened at all.
        // This writes into the form itself and does NOT re-render, so the message
        // cannot be wiped out by a subsequent render pass.
        function showFormError(elementId, text) {
            const el = document.getElementById(elementId);
            if (!el) return false;
            el.textContent = text;
            el.classList.remove('hidden');
            if (el.scrollIntoView) {
                try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
            }
            return true;
        }

        function clearFormError(elementId) {
            const el = document.getElementById(elementId);
            if (el) { el.textContent = ''; el.classList.add('hidden'); }
        }

        async function handleSignup() {
            clearFormError('signup-error');
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const church = document.getElementById('signup-church').value;
            const password = document.getElementById('signup-password').value;

            // Honeypot: real users never see or fill this field; bots often do.
            const honeypot = document.getElementById('signup-website');
            if (honeypot && honeypot.value) {
                trackEvent('honeypot_triggered', { page: 'signup' });
                setFlash('error', "Couldn't create your account. Please try again.");
                render();
                return;
            }

            if (!password || password.length < 8) {
                if (!showFormError('signup-error', 'Please choose a password of at least 8 characters.')) {
                    setFlash('error', 'Please choose a password of at least 8 characters.');
                    render();
                }
                return;
            }

            const referredBy = new URLSearchParams(window.location.search).get('ref') || null;

            try {
                // 1. Create the real auth user. This is what verifies the password
                //    from now on - the profile row no longer grants access by itself.
                const auth = await supabaseAuth('/signup', {
                    email: email,
                    password: password,
                    data: { display_name: name, church_name: church }
                });

                // Projects with email confirmation switched on return no session.
                if (!auth.access_token) {
                    setFlash('success', "Account created. Check " + email + " for a confirmation link, then sign in.");
                    goTo('login');
                    return;
                }
                setSession(auth);

                // 2. Create the profile row, keyed to the auth user id so the two
                //    can never drift apart.
                const res = await gtFetch(CREATE_USER_WEBHOOK_URL, {
                    user_id: auth.user.id, email, name, church,
                    starting_credits: 0, referred_by: referredBy
                });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                const data = await res.json();
                applyAccountFromServer(data.user, name, church);

                sendNotification('welcome', { user_email: email, user_name: name });

                if (referredBy) {
                    setFlash('success', "Welcome! You and your friend both got 10 bonus credits.");
                }
                goTo('dashboard');
            } catch (err) {
                let msg = err.message;
                if (/already registered/i.test(msg)) {
                    msg = 'An account already exists for that email. Try signing in instead.';
                } else if (/rate limit/i.test(msg)) {
                    msg = "We're temporarily unable to send confirmation emails (too many signups in a short time). Please try again in a few minutes.";
                } else if (/failed to fetch|networkerror/i.test(msg)) {
                    msg = "Couldn't reach the server. Please check your internet connection and try again.";
                }
                if (!showFormError('signup-error', msg)) {
                    setFlash('error', "Couldn't create your account: " + msg);
                    render();
                }
            }
        }

        async function handleLoginSubmit() {
            clearFormError('login-error');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                // Password is verified by Supabase. Previously any password was
                // accepted for any email, so knowing an address was enough to
                // take over an account and spend its credits.
                const auth = await supabaseAuth('/token?grant_type=password', { email, password });
                setSession(auth);

                const res = await gtFetch(CREATE_USER_WEBHOOK_URL, { user_id: auth.user.id, email });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                const data = await res.json();
                applyAccountFromServer(data.user, app.user.name, app.user.church);
                goTo('dashboard');
            } catch (err) {
                let msg = err.message;
                if (/invalid login/i.test(msg)) {
                    msg = 'That email and password combination is not recognised. Please check your email and password, or sign up if you don\u2019t have an account yet.';
                } else if (/email.?not.?confirmed/i.test(msg) || /confirm/i.test(msg)) {
                    msg = "Please confirm your email before signing in. Check your inbox (and spam folder) for the confirmation link we sent when you signed up.";
                } else if (/failed to fetch|networkerror/i.test(msg)) {
                    msg = "Couldn't reach the server. Please check your internet connection and try again.";
                }
                // Show it inside the form box first - that's the one place the
                // user is definitely looking. Fall back to the banner if the
                // form isn't on screen for some reason.
                if (!showFormError('login-error', msg)) {
                    setFlash('error', "Couldn't sign you in: " + msg);
                    render();
                }
            }
        }

        function handleLogout() {
            const s = getSession();
            if (s && s.access_token) {
                // Best effort - revoke server-side so the token can't be reused.
                fetch(SUPABASE_URL + '/auth/v1/logout', {
                    method: 'POST',
                    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + s.access_token }
                }).catch(() => {});
            }
            setSession(null);
            app.isLoggedIn = false;
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('user');
            goTo('home');
        }

        // Longer sermons cost proportionally more to generate, so the base package
        // scales with length. Add-ons don't scale - a social post is the same work
        // whether the sermon was 15 minutes or 90.
        const DURATION_MULTIPLIERS = { 15: 0.75, 30: 1, 45: 1.25, 60: 1.5, 90: 2 };
        function durationMultiplier(mins) { return DURATION_MULTIPLIERS[mins] || 1; }

        function getSermonTotal() {
            const mult = durationMultiplier(app.sermonState.duration);
            let total = Math.ceil(packagePrices[app.sermonState.package] * mult);
            app.sermonState.addons.forEach(addon => { total += ALL_ADDON_PRICES[addon] || 0; });
            return total;
        }

        function fillExample() {
            app.sermonState.inputType = 'passage';
            app.sermonState.inputContent = 'Romans 8:1-4';
            render();
        }

        function updateInputContent(value) {
            app.sermonState.inputContent = value.slice(0, 5000);
            const counter = document.getElementById('input-char-count');
            if (counter) counter.textContent = app.sermonState.inputContent.length + '/5000';
        }

        // This is the ONLY place user_email is read from for sermon delivery -
        // always the account's email (set at signup, editable on Account page),
        // never anything typed elsewhere. This guarantees the finished sermon
        // is always emailed to whatever address the customer has on file.
        const SERMON_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/generate-sermon';
        const EXTRACT_PDF_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/extract-pdf';
        const TRANSCRIBE_AUDIO_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/transcribe-audio';

        app.uploadState = { uploading: false, error: null, fileName: null };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handlePdfUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 8 * 1024 * 1024) {
                setFlash('error', 'PDF is too large - please upload a file under 8MB.');
                render();
                return;
            }
            app.uploadState = { uploading: true, error: null, fileName: file.name };
            render();
            try {
                const base64 = await fileToBase64(file);
                const res = await gtFetch(EXTRACT_PDF_WEBHOOK_URL, { pdf_base64: base64, filename: file.name, user_email: app.user.email });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 150) : ''));
                }
                const data = await res.json();
                if (!data.extracted_text || !data.extracted_text.trim()) {
                    throw new Error('No text could be extracted from this PDF - it may be a scanned image without real text.');
                }
                app.sermonState.inputContent = data.extracted_text.slice(0, 5000);
                app.uploadState = { uploading: false, error: null, fileName: file.name };
                setFlash('success', 'Extracted ' + data.extracted_text.split(' ').length + ' words from "' + file.name + '".');
            } catch (err) {
                app.uploadState = { uploading: false, error: err.message, fileName: null };
                setFlash('error', "Couldn't process that PDF (" + err.message + ").");
            }
            render();
        }

        // Supported by the transcription service. Checking here means a pastor
        // gets a clear answer immediately instead of waiting through an upload
        // that was never going to work.
        const ALLOWED_AUDIO_EXTENSIONS = ['mp3', 'm4a', 'wav', 'ogg', 'oga', 'webm', 'flac', 'mp4', 'mpga', 'mpeg'];

        // Audio is sent as text, which makes it about a third larger in transit,
        // so the real ceiling sits below the server's raw limit. The server now
        // accepts 32MB (verified by sending a 20MB payload through), and 18MB of
        // audio becomes roughly 24MB in transit - comfortably inside that, with
        // headroom left for the rest of the request.
        //
        // 18MB covers a 90 minute sermon even at fairly generous quality.
        // Groq downsamples everything to 16KHz mono anyway, so exporting at
        // voice quality costs no transcription accuracy whatsoever.
        const MAX_AUDIO_MB = 18;

        function checkAudioFile(file) {
            const name = (file.name || '').toLowerCase();
            const ext = name.indexOf('.') > -1 ? name.split('.').pop() : '';
            if (!ext || ALLOWED_AUDIO_EXTENSIONS.indexOf(ext) === -1) {
                return "We can't read that file type. Please upload MP3, M4A, WAV, OGG, WEBM or FLAC.";
            }
            if (file.size > MAX_AUDIO_MB * 1024 * 1024) {
                const mb = (file.size / (1024 * 1024)).toFixed(1);
                return 'That file is ' + mb + 'MB and the limit is ' + MAX_AUDIO_MB + 'MB. Good news: re-exporting it at voice quality will shrink it a lot without hurting the transcription at all. See "Recording too big?" below the upload box for how.';
            }
            if (file.size < 1024) {
                return 'That file looks empty. Please check the recording and try again.';
            }
            return null;
        }

        async function handleAudioUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const audioCheck = checkAudioFile(file);
            if (audioCheck) {
                setFlash('error', audioCheck);
                render();
                return;
            }
            app.uploadState = { uploading: true, error: null, fileName: file.name };
            render();
            try {
                const base64 = await fileToBase64(file);
                const res = await gtFetch(TRANSCRIBE_AUDIO_WEBHOOK_URL, { audio_base64: base64, filename: file.name, user_email: app.user.email, project_id: null });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 150) : ''));
                }
                const data = await res.json();
                if (!data.transcription || !data.transcription.trim()) {
                    throw new Error('No speech could be transcribed from this file.');
                }
                app.sermonState.inputContent = data.transcription.slice(0, 5000);
                app.uploadState = { uploading: false, error: null, fileName: file.name };
                setFlash('success', 'Transcribed ' + data.word_count + ' words from "' + file.name + '".');
            } catch (err) {
                app.uploadState = { uploading: false, error: err.message, fileName: null };
                setFlash('error', "Couldn't transcribe that audio (" + err.message + ").");

            render();

const content = (app.sermonState.inputContent || '').trim();

            if (app.sermonState.inputType === 'youtube' && !/^https?:\/\/(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)/i.test(content)) {
                setFlash('error', 'That doesn\'t look like a YouTube video link. It should start with youtube.com/watch or youtu.be — search-result links from Yahoo, Bing, or Google won\'t work. Open the video on YouTube and copy the address bar.');

            const destinationEmail = app.user.email; // account email, explicitly
            const projectId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('proj-' + Date.now());

            const payload = {
                user_id: ensureUserId(),
                user_email: destinationEmail,
                project_id: projectId,
                input_type: app.sermonState.inputType,
                input_content: app.sermonState.inputContent || 'Romans 8:1-4',
                base_package: app.sermonState.package,
                credits_cost: total,

                bible_translation: app.sermonState.translation,

                reading_level: app.sermonState.readingLevel,
                citation_mode: app.sermonState.citationMode,
                addons: app.sermonState.addons
            };

            // Switch to the generating screen BEFORE the network call. The webhook
            // can take 10-15 seconds to respond, and sitting on the checkout page
            // that whole time makes people think the button didn't register and
            // click it again - which fires duplicate generations.
            // Remember what they asked for. Generation inputs are not stored in
            // the database, so this is the only way a failed sermon can be
            // retried without the pastor retyping everything.
            try {
                localStorage.setItem('lastSermonRequest', JSON.stringify(app.sermonState));
            } catch (e) {}

            app.generatingProjectId = projectId;
            app.generatingStartedAt = Date.now();
            app.currentPage = 'generating';
            render();
            startGeneratingTicker();

            // The proxy in front of n8n cuts the connection before a long sermon
            // finishes, even though generation succeeds. So we no longer wait on
            // the response to decide anything - polling the project row is the
            // single source of truth. Start it immediately.
            pollForCompletion(projectId);

            app.user.credits -= total;
            localStorage.setItem('user', JSON.stringify(app.user));

            sendNotification('project_submitted', {
                user_email: destinationEmail,
                user_name: app.user.name,
                base_package: app.sermonState.package,
                input_type: app.sermonState.inputType,
                credits_cost: total
            });

            // Fire-and-forget. A dropped connection here means nothing - the work
            // carries on server-side and polling will see the result. The only
            // thing worth reacting to is the server explicitly telling us it
            // stopped before generation ever started.
            gtFetch(SERMON_WEBHOOK_URL, payload).then(async function (res) {
                let submitResult = {};
                try { submitResult = await res.json(); } catch (e) { return; }
                if (submitResult && submitResult.failed_before_generation) {
                    app.generatingProjectId = null;
                    app.user.credits += total;
                    localStorage.setItem('user', JSON.stringify(app.user));
                    setFlash('error', submitResult.message || "Your sermon couldn't be started. You have not been charged.");
                    refreshAccount();
                    goTo('dashboard');
                }
            }).catch(function () {
                // Connection dropped or timed out - expected on long sermons.
                // pollForCompletion decides the outcome.
            });
        }

        let generatingTicker = null;
        function startGeneratingTicker() {
            if (generatingTicker) clearInterval(generatingTicker);
            generatingTicker = setInterval(function () {
                if (app.currentPage !== 'generating') {
                    clearInterval(generatingTicker);
                    generatingTicker = null;
                    return;
                }
                render();
            }, 1000);
        }

        async function pollForCompletion(projectId, attempt) {
            attempt = attempt || 1;
            const MAX_ATTEMPTS = 100; // ~5 minutes at 3s intervals

            if (app.currentPage !== 'generating' || app.generatingProjectId !== projectId) {
                return; // user navigated away - stop polling
            }
            render();

            if (attempt > MAX_ATTEMPTS) {
                setFlash('info', "This is taking longer than usual, and we're still working on it \u2014 failed steps retry automatically. We'll email it as soon as it's ready, and it will appear on your dashboard. Nothing has been lost.");
                goTo('dashboard');
                return;
            }

            try {
                const res = await gtFetch(LIST_PROJECTS_WEBHOOK_URL, { user_id: ensureUserId()
                });
                if (res.ok) {
                    const data = await res.json();
                    const project = (data.projects || []).find(p => p.id === projectId);
                    if (project && project.status === 'ready') {
                        app.viewingProject = project;
                        app.currentPage = 'sermon-viewer';
                        setFlash('success', 'Your sermon is ready \u2014 it is shown below, and a copy has been emailed to ' + app.user.email + '.');
                        render();
                        return;
                    }
                    if (project && project.status === 'failed') {
                        setFlash('error', "Generation failed \u2014 your credits were refunded in full, so you have not been charged. Use the Try Again button on your dashboard to resubmit with the same settings.");
                        goTo('dashboard');
                        return;
                    }
                }
            } catch (err) {
                // Transient network error during polling - just retry, don't fail the whole flow
            }

            setTimeout(() => pollForCompletion(projectId, attempt + 1), 3000);
        }

        async function handleRepurposeAudioUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const audioCheck = checkAudioFile(file);
            if (audioCheck) {
                setFlash('error', audioCheck);
                render();
                return;
            }
            app.repurpose.uploading = true;
            render();
            try {
                const base64 = await fileToBase64(file);
                const res = await gtFetch(TRANSCRIBE_AUDIO_WEBHOOK_URL, { audio_base64: base64, filename: file.name, user_email: app.user.email, project_id: null });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                const data = await res.json();
                if (!data.transcription || !data.transcription.trim()) throw new Error('No speech could be transcribed from this file.');
                app.repurpose.rawText = data.transcription;
                app.repurpose.fileName = file.name;
                setFlash('success', 'Transcribed ' + data.word_count + ' words from "' + file.name + '".');
            } catch (err) {
                setFlash('error', "Couldn't transcribe that audio (" + err.message + ").");
            }
            app.repurpose.uploading = false;
            render();
        }

                render();
                return;

            app.repurpose.loading = true;

            try {

        async function loadProjects() {

        // While any project is still generating, quietly refresh every 10s
        // so the dashboard updates without a manual reload.
        function manageProjectPolling() {
            const hasGenerating = (app.projects || []).some(p => p.status === 'generating' || p.status === 'pending');
            if (hasGenerating && !pollTimer) {
                pollTimer = setInterval(loadProjects, 10000);
            } else if (!hasGenerating && pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function viewProject(id) {
            const p = (app.projects || []).find(pr => pr.id === id);

                setFlash('error', (p.title ? '"' + p.title + '"' : 'This sermon') + ' failed to generate: ' + (p.error_message || 'unknown error') + '. Your credits were automatically refunded.');

            }
        }

        // When a pastor clicks the reset link in their email, Supabase sends them
        // back here with a temporary token in the address bar (after the #).
        // Pick it up, hold it in memory, and show the "set a new password" page.
        // The token is cleared from the address bar so it isn't left in history.
        let recoveryToken = null;

        function detectPasswordRecovery() {
            const hash = window.location.hash || '';
            if (hash.indexOf('type=recovery') === -1) return false;
            const params = new URLSearchParams(hash.replace(/^#/, ''));
            const token = params.get('access_token');
            if (!token) return false;
            recoveryToken = token;
            try {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            } catch (e) {}
            app.currentPage = 'reset-password';
            return true;
        }

        async function applyNewPassword() {
            clearFormError('reset-password-error');
            const pw = document.getElementById('new-password').value;
            const confirm = document.getElementById('new-password-confirm').value;

            if (!pw || pw.length < 8) {
                showFormError('reset-password-error', 'Please choose a password of at least 8 characters.');
                return;
            }
            if (pw !== confirm) {
                showFormError('reset-password-error', "Those two passwords don't match. Please retype them.");
                return;
            }
            if (!recoveryToken) {
                showFormError('reset-password-error', 'This reset link has expired or was already used. Please request a new one from the "Forgot your password?" link.');
                return;
            }

            try {
                const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        apikey: SUPABASE_ANON_KEY,
                        Authorization: 'Bearer ' + recoveryToken
                    },
                    body: JSON.stringify({ password: pw })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error_description || data.msg || data.message || ('Request failed (' + res.status + ')'));
                }
                recoveryToken = null;
                setSession(null);
                app.isLoggedIn = false;
                localStorage.removeItem('isLoggedIn');
                setFlash('success', 'Your password has been updated. Please sign in with your new password.');
                goTo('login');
            } catch (err) {
                let msg = err.message;
                if (/expired|invalid|jwt/i.test(msg)) {
                    msg = 'This reset link has expired or was already used. Please request a new one from the "Forgot your password?" link.';
                } else if (/failed to fetch|networkerror/i.test(msg)) {
                    msg = "Couldn't reach the server. Please check your internet connection and try again.";
                }
                showFormError('reset-password-error', msg);
            }
        }

        // Sends the finished sermon back through the repurpose pipeline as a
        // discounted bundle. Reuses the existing repurpose webhook rather than
        // adding another endpoint.
        async function orderFollowUpBundle(bundleJson) {
            // The offer only ever lists what this sermon is missing, so the
            // order must use that same list - not a fixed one that could
            // re-buy something the pastor already has.
            let bundle = ['Small Group Guide', 'Discussion Questions', 'Social Posts', 'Blog Article'];
            if (bundleJson) {
                try {
                    const parsed = JSON.parse(bundleJson);
                    if (Array.isArray(parsed) && parsed.length) bundle = parsed;
                } catch (e) {}
            }
            const fullPrice = bundle.reduce((sum, a) => sum + (ALL_ADDON_PRICES[a] || 0), 0);
            const offerPrice = Math.ceil(fullPrice * 0.6);

            if (app.user.credits < offerPrice) {
                setFlash('error', 'You need ' + offerPrice + ' credits for this bundle.');
                render();
                return;
            }

            const s = app.viewingProject && app.viewingProject.sermon_json;
            if (!s) { setFlash('error', 'Could not read this sermon. Please reload and try again.'); render(); return; }

            setFlash('info', 'Building your follow-up materials \u2014 we will email them shortly.');
            render();

            try {
                const res = await gtFetch(REPURPOSE_SERMON_WEBHOOK_URL, {
                        raw_text: sermonToPlainText(s),
                        user_id: ensureUserId(),
                        user_email: app.user.email,
                        addons: bundle,
                        credits_cost: offerPrice,
                        doctrinal_position: app.sermonState.doctrinalPosition,
                        bible_translation: app.sermonState.translation,
                        audience: app.sermonState.audience
                    });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                app.user.credits -= offerPrice;
                localStorage.setItem('user', JSON.stringify(app.user));
                setFlash('success', 'On its way \u2014 all four will be emailed to ' + app.user.email + '.');
            } catch (err) {
                setFlash('error', "Couldn't order that bundle (" + err.message + "). You were not charged.");
            }
            render();
        }

        function sermonToPlainText(s) {
            let lines = [];
            lines.push(s.title || 'Untitled Sermon');
            if (s.scripture_reference) lines.push(s.scripture_reference);
            lines.push('');
            if (s.big_idea) { lines.push('BIG IDEA'); lines.push(s.big_idea); lines.push(''); }
            if (s.introduction) { lines.push('INTRODUCTION'); lines.push(s.introduction); lines.push(''); }
            if ((s.main_points || []).length) {
                lines.push('MAIN POINTS');
                s.main_points.forEach((pt, i) => {
                    lines.push((i + 1) + '. ' + pt.point);
                    lines.push(pt.explanation || '');
                    if (pt.scripture) lines.push('Scripture: ' + pt.scripture);
                    if (pt.application) lines.push('Application: ' + pt.application);
                    lines.push('');
                });
            }
            if ((s.verse_by_verse_commentary || []).length) {
                lines.push('VERSE-BY-VERSE COMMENTARY');
                s.verse_by_verse_commentary.forEach(v => { lines.push(v.verse + ': ' + v.commentary); });
                lines.push('');
            }
            if (s.conclusion) { lines.push('CONCLUSION'); lines.push(s.conclusion); lines.push(''); }
            if ((s.key_takeaways || []).length) {
                lines.push('KEY TAKEAWAYS');
                s.key_takeaways.forEach(t => lines.push('- ' + t));
                lines.push('');
            }
            if ((s.discussion_questions || []).length) {
                lines.push('DISCUSSION QUESTIONS');
                s.discussion_questions.forEach((q, i) => lines.push((i + 1) + '. ' + q));
            }
            return lines.join('\n');
        }

            const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"><title>${s.title || 'Sermon'}</title></head>
                <body style="font-family:Georgia,serif;">${text}</body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = (s.title || 'sermon').replace(/[^a-z0-9]/gi, '_') + '.doc';
            link.click();
            trackEvent('export_word', { page: 'sermon-viewer' });
        }

        function downloadAsPdf() {
            const s = app.viewingProject.sermon_json;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'pt', format: 'letter' });
            const margin = 56;
            const maxWidth = 500;
            let y = margin;
            const lineHeight = 16;

            function addText(text, size, style) {
                doc.setFontSize(size);
                doc.setFont('times', style || 'normal');
                const lines = doc.splitTextToSize(text, maxWidth);
                lines.forEach(line => {
                    if (y > 720) { doc.addPage(); y = margin; }
                    doc.text(line, margin, y);
                    y += lineHeight;
                });
            }

            addText(s.title || 'Untitled Sermon', 20, 'bold');
            if (s.scripture_reference) addText(s.scripture_reference, 12, 'italic');
            y += 8;
            if (s.big_idea) { addText('BIG IDEA', 11, 'bold'); addText(s.big_idea, 11); y += 8; }
            if (s.introduction) { addText('INTRODUCTION', 11, 'bold'); addText(s.introduction, 11); y += 8; }
            (s.main_points || []).forEach((pt, i) => {
                addText((i + 1) + '. ' + pt.point, 12, 'bold');
                addText(pt.explanation || '', 11);
                if (pt.scripture) addText('Scripture: ' + pt.scripture, 10, 'italic');
                if (pt.application) addText('Application: ' + pt.application, 10);
                y += 6;
            });
            (s.verse_by_verse_commentary || []).forEach(v => {
                addText(v.verse, 11, 'bold');
                addText(v.commentary, 11);
                y += 4;
            });
            if (s.conclusion) { addText('CONCLUSION', 11, 'bold'); addText(s.conclusion, 11); y += 8; }
            if ((s.key_takeaways || []).length) {
                addText('KEY TAKEAWAYS', 11, 'bold');
                s.key_takeaways.forEach(t => addText('\u2022 ' + t, 11));
                y += 8;
            }
            if ((s.discussion_questions || []).length) {
                addText('DISCUSSION QUESTIONS', 11, 'bold');
                s.discussion_questions.forEach((q, i) => addText((i + 1) + '. ' + q, 11));
            }

            doc.save((s.title || 'sermon').replace(/[^a-z0-9]/gi, '_') + '.pdf');
            trackEvent('export_pdf', { page: 'sermon-viewer' });
        }

        // Escape anything coming back from the AI before putting it in the page.
        function gtEsc(v) {
            if (v === null || v === undefined) return '';
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Renders the add-ons a pastor paid for, so they live in the app and
        // not only in an email that may never have arrived.
        function renderAddonResults(p) {
            const addons = (p && p.addon_results) || [];
            const purchased = (p && p.selected_addons) || [];

            // Nothing bought - show nothing at all.
            if (purchased.length === 0 && addons.length === 0) return '';

            // Bought but nothing stored: say so honestly instead of a blank space.
            if (addons.length === 0) {
                return `
                    <div class="bg-white rounded-2xl border border-gray-200 p-8 mt-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-2">Your Add-ons</h2>
                        <p class="text-gray-600 text-sm">These were sent to your email. We don't have a copy saved in the app for this project. If you can't find the email, contact support@gracetools.com and we'll resend it.</p>
                    </div>
                `;
            }

            const list = (arr, ordered) => {
                const tag = ordered ? 'ol' : 'ul';
                const cls = ordered ? 'list-decimal' : 'list-disc';
                return `<${tag} class="${cls} pl-6 text-gray-700 space-y-1 mb-3">` +
                    (arr || []).map(x => `<li>${gtEsc(typeof x === 'object' ? (x.question || x.point || JSON.stringify(x)) : x)}</li>`).join('') +
                    `</${tag}>`;
            };
            const head = t => `<h4 class="font-semibold text-gray-900 mt-4 mb-1">${gtEsc(t)}</h4>`;
            const para = t => `<p class="text-gray-700 text-sm leading-relaxed mb-3" style="white-space:pre-line;">${gtEsc(t)}</p>`;

            const sections = addons.map(a => {
                const type = a.addon_type || a.title || 'Add-on';
                let body = '';

                if (a.addon_type === 'Fact Checker') {
                    const concerns = a.concerns || [];
                    const clean = concerns.length === 0;
                    body += `<div class="${clean ? 'bg-green-50 border-green-500' : 'bg-amber-50 border-amber-500'} border-l-4 p-3 rounded-r-lg mb-3">
                        <p class="font-semibold text-gray-900 text-sm">${gtEsc(a.overall_assessment || '')}</p>
                    </div>`;
                    if (concerns.length > 0) {
                        body += concerns.map(c => {
                            const sev = String(c.severity || '').toLowerCase();
                            const color = sev === 'high' ? 'bg-red-100 text-red-800'
                                : sev === 'medium' ? 'bg-amber-100 text-amber-800'
                                : 'bg-gray-100 text-gray-700';
                            return `<div class="mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <span class="inline-block ${color} text-xs font-bold uppercase px-2 py-0.5 rounded mb-2">${gtEsc(c.severity || 'note')}</span>
                                <p class="text-gray-700 text-sm mb-1">${gtEsc(c.issue)}</p>
                                <p class="text-gray-500 text-xs italic">${gtEsc(c.location)}</p>
                            </div>`;
                        }).join('');
                    }
                    if (a.scripture_accuracy_note) { body += head('Scripture accuracy'); body += para(a.scripture_accuracy_note); }
                    if (a.doctrinal_consistency_note) { body += head('Doctrinal consistency'); body += para(a.doctrinal_consistency_note); }
                    body += `<p class="text-xs text-gray-400 mt-3">This is a review to help you check your work \u2014 not a verdict. Always confirm anything flagged against Scripture yourself.</p>`;

                } else if (a.addon_type === 'Social Posts') {
                    if (a.facebook && a.facebook.post) { body += head('Facebook'); body += para(a.facebook.post); }
                    if (a.instagram && a.instagram.caption) { body += head('Instagram'); body += para(a.instagram.caption); }
                    if ((a.x_twitter || []).length) { body += head('X / Twitter'); body += list(a.x_twitter, false); }
                    if (a.quote_graphic) { body += head('Quote graphic'); body += para(a.quote_graphic); }
                    if (a.key_verse_graphic) { body += head('Key verse graphic'); body += para(a.key_verse_graphic); }

                } else if (a.addon_type === 'Blog Article') {
                    if (a.meta_description) body += `<p class="text-gray-500 text-sm italic mb-3">${gtEsc(a.meta_description)}</p>`;
                    if (a.introduction) body += para(a.introduction);
                    (a.body_sections || []).forEach(sec => { body += head(sec.heading); body += para(sec.content); });
                    if (a.conclusion) body += para(a.conclusion);
                    if ((a.suggested_tags || []).length) body += `<p class="text-gray-500 text-xs">Tags: ${gtEsc((a.suggested_tags || []).join(', '))}</p>`;

                } else if (a.addon_type === 'YouTube Title & Thumbnail') {
                    if ((a.titles || []).length) { body += head('Title options'); body += list(a.titles, true); }
                    if ((a.thumbnail_ideas || []).length) {
                        body += head('Thumbnail ideas');
                        body += (a.thumbnail_ideas || []).map(t => `<div class="mb-2 p-3 bg-gray-50 rounded-lg border border-gray-200"><p class="text-gray-700 text-sm"><strong>Text:</strong> ${gtEsc(t.text_overlay)}</p><p class="text-gray-600 text-sm"><strong>Visual:</strong> ${gtEsc(t.visual_description)}</p></div>`).join('');
                    }

                } else if (a.addon_type === 'YouTube Description') {
                    if (a.description) body += para(a.description);
                    if (a.suggested_pinned_comment) { body += head('Suggested pinned comment'); body += para(a.suggested_pinned_comment); }

                } else if (a.addon_type === 'YouTube Tags') {
                    body += para((a.tags || []).join(', '));

                } else if (a.addon_type === 'YouTube Chapters') {
                    if (a.note) body += `<p class="text-gray-500 text-xs italic mb-2">${gtEsc(a.note)}</p>`;
                    body += (a.chapters || []).map(c => `<div class="mb-2"><p class="text-gray-900 text-sm font-semibold">${gtEsc(c.placeholder_time)} \u2014 ${gtEsc(c.title)}</p><p class="text-gray-600 text-sm">${gtEsc(c.content_summary)}</p></div>`).join('');

                } else if (a.addon_type === 'YouTube Hook') {
                    body += list(a.hooks, true);

                } else if (a.addon_type === 'Printable Handout' || a.fill_in_sections) {
                    if (a.big_idea_blank) body += para(a.big_idea_blank);
                    (a.fill_in_sections || []).forEach(sec => {
                        body += head(sec.heading);
                        body += (sec.blanks || []).map(b => `<p class="text-gray-700 text-sm mb-1">${gtEsc(b)}</p>`).join('');
                    });
                    if (a.takeaway_blank) body += `<p class="text-purple-700 font-semibold mt-3">${gtEsc(a.takeaway_blank)}</p>`;

                } else {
                    // Youth Version, Small Group Guide, Discussion Questions and
                    // anything added later all fall through to these shapes.
                    if (a.big_idea) body += para(a.big_idea);
                    if (a.overview) body += para(a.overview);
                    if (a.opening_hook) { body += head('Opening hook'); body += para(a.opening_hook); }
                    if (a.ice_breaker) { body += head('Ice breaker'); body += para(a.ice_breaker); }
                    if (a.scripture_reading) { body += head('Scripture reading'); body += para(a.scripture_reading); }
                    if ((a.main_points || []).length) {
                        body += head('Main points');
                        body += (a.main_points || []).map((pt, i) => `<div class="mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200"><p class="font-semibold text-gray-900 text-sm mb-1">${i + 1}. ${gtEsc(pt.point)}</p><p class="text-gray-600 text-sm">${gtEsc(pt.explanation)}</p>${pt.scripture ? `<p class="text-purple-600 text-xs italic mt-1">${gtEsc(pt.scripture)}</p>` : ''}${pt.application ? `<p class="text-gray-700 text-xs mt-1"><strong>Application:</strong> ${gtEsc(pt.application)}</p>` : ''}</div>`).join('');
                    }
                    const qs = a.discussion_questions || a.questions || [];
                    if (qs.length) { body += head('Discussion questions'); body += list(qs, true); }
                    if ((a.key_takeaways || []).length) { body += head('Key takeaways'); body += list(a.key_takeaways, false); }
                    if (a.key_verse) { body += head('Key verse'); body += para(a.key_verse); }
                    if (a.prayer_focus) { body += head('Prayer focus'); body += para(a.prayer_focus); }
                    if (a.action_step) { body += head('Action step'); body += para(a.action_step); }
                    if (a.closing_challenge) { body += head('Closing challenge'); body += para(a.closing_challenge); }
                }

                if (!body) body += `<p class="text-gray-500 text-sm">This add-on was generated but has nothing we can display here. It was included in your email.</p>`;

                return `
                    <div class="mb-4 border border-gray-200 rounded-xl overflow-hidden">
                        <button type="button" onclick="toggleAddon('${gtEsc(type).replace(/'/g, '')}')" class="w-full flex items-center justify-between px-5 py-4 bg-gray-50 hover:bg-gray-100 text-left cursor-pointer border-0">
                            <span class="font-semibold text-gray-900">${gtEsc(type)}</span>
                            <span class="text-purple-600 text-sm">${app.openAddons && app.openAddons[type] ? 'Hide' : 'Show'}</span>
                        </button>
                        ${app.openAddons && app.openAddons[type] ? `<div class="px-5 py-4 bg-white">${body}</div>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-white rounded-2xl border border-gray-200 p-8 mt-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-1">Your Add-ons</h2>
                    <p class="text-gray-500 text-sm mb-5">These were also emailed to you. They're saved here so you always have them.</p>
                    ${sections}
                    <div class="mt-4 flex gap-2">
                        <button onclick="downloadAddonsAsWord()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-50">Download Add-ons (Word)</button>
                    </div>
                </div>
            `;
        }

        function toggleAddon(type) {
            if (!app.openAddons) app.openAddons = {};
            app.openAddons[type] = !app.openAddons[type];
            render();
        }

        // Flattens whatever shape each add-on has into readable lines.
        function addonsToPlainText(p) {
            const addons = (p && p.addon_results) || [];
            const lines = [];
            addons.forEach(a => {
                lines.push((a.addon_type || a.title || 'Add-on').toUpperCase());
                lines.push('');
                const walk = (val, indent) => {
                    if (val === null || val === undefined || val === '') return;
                    if (Array.isArray(val)) { val.forEach(v => walk(v, indent)); return; }
                    if (typeof val === 'object') {
                        Object.keys(val).forEach(k => {
                            if (k === 'addon_type') return;
                            const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                            const v = val[k];
                            if (v && typeof v === 'object') { lines.push(indent + label + ':'); walk(v, indent + '  '); }
                            else if (v !== null && v !== undefined && v !== '') lines.push(indent + label + ': ' + v);
                        });
                        return;
                    }
                    lines.push(indent + val);
                };
                walk(a, '');
                lines.push('');
            });
            return lines.join('\n');
        }

        function downloadAddonsAsWord() {
            const p = app.viewingProject;
            const text = addonsToPlainText(p);
            if (!text.trim()) { setFlash('error', 'There are no saved add-ons to download for this project.'); render(); return; }
            const body = text.split('\n').map(l => l ? `<p>${gtEsc(l)}</p>` : '<p>&nbsp;</p>').join('');
            const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Add-ons</title></head><body style="font-family:Georgia,serif;">${body}</body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = ((p.title || 'sermon').replace(/[^a-z0-9]+/gi, '-').toLowerCase()) + '-addons.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function SermonViewerPage() {

            if (!p || !p.sermon_json) {
                return `<div class="pt-20 min-h-screen bg-gray-50 px-6 py-8"><div class="max-w-3xl mx-auto text-center text-gray-500 p-12">Sermon not found. <a onclick="goTo('dashboard')" class="text-purple-600 underline cursor-pointer">Back to dashboard</a></div></div>`;

            const s = p.sermon_json;
            const editing = app.editMode;

            const toolbar = `
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">

            `;

            if (editing) {
                return `

                                </div>
                                <div>
                                    <label for="edit-big-idea" class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Big Idea</label>
                                    <textarea id="edit-big-idea" rows="2" class="w-full px-3 py-2 border border-gray-200 rounded-lg">${s.big_idea || ''}</textarea>
                                </div>
                                ${s.introduction !== undefined ? `
                                    <div>
                                        <label for="edit-introduction" class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Introduction</label>
                                        <textarea id="edit-introduction" rows="4" class="w-full px-3 py-2 border border-gray-200 rounded-lg">${s.introduction || ''}</textarea>
                                    </div>
                                ` : ''}
                                ${(s.main_points || []).length > 0 ? `
                                    <div>
                                        <p class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Main Points</p>
                                        ${s.main_points.map((pt, i) => `
                                            <div class="mb-3 p-3 bg-gray-50 rounded-lg border border-gray-200 space-y-2">
                                                <input id="edit-point-${i}" value="${(pt.point || '').replace(/"/g, '&quot;')}" class="w-full px-2 py-1 border border-gray-200 rounded font-semibold text-sm" />
                                                <textarea id="edit-point-explanation-${i}" rows="2" class="w-full px-2 py-1 border border-gray-200 rounded text-sm">${pt.explanation || ''}</textarea>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                ${s.conclusion !== undefined ? `
                                    <div>
                                        <label for="edit-conclusion" class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Conclusion</label>
                                        <textarea id="edit-conclusion" rows="4" class="w-full px-3 py-2 border border-gray-200 rounded-lg">${s.conclusion || ''}</textarea>

                                ${(s.key_takeaways || []).length > 0 ? `

                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-8">
                    <div class="max-w-3xl mx-auto">
                        ${toolbar}
                        <div class="bg-white rounded-2xl border border-gray-200 p-8">
                            <h1 class="text-3xl font-bold text-gray-900 mb-2">${s.title || 'Untitled Sermon'}</h1>
                            <p class="text-purple-600 font-semibold mb-6">${s.scripture_reference || ''}</p>

                            ${s.big_idea ? `
                                <div class="bg-purple-50 border-l-4 border-purple-600 p-4 rounded-r-lg mb-6">
                                    <p class="text-xs font-bold text-purple-700 uppercase tracking-wide mb-1">Big Idea</p>
                                    <p class="italic text-gray-900">${s.big_idea}</p>
                                </div>
                            ` : ''}

                            ${s.introduction ? `<h3 class="font-bold text-purple-700 border-b pb-2 mb-3">Introduction</h3><p class="text-gray-700 leading-relaxed mb-6">${s.introduction}</p>` : ''}

                            ${(s.main_points || []).length > 0 ? `
                                <h3 class="font-bold text-purple-700 border-b pb-2 mb-3">Main Points</h3>
                                ${s.main_points.map((pt, i) => `
                                    <div class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                                        <p class="font-semibold text-gray-900 mb-1">${i + 1}. ${pt.point}</p>
                                        <p class="text-gray-600 text-sm mb-2">${pt.explanation}</p>
                                        ${pt.scripture ? `<p class="text-purple-600 text-xs italic mb-1">\ud83d\udcd6 ${pt.scripture}</p>` : ''}
                                        ${pt.application ? `<p class="text-gray-700 text-xs"><strong>Application:</strong> ${pt.application}</p>` : ''}
                                    </div>
                                `).join('')}
                            ` : ''}

                            ${(s.verse_by_verse_commentary || []).length > 0 ? `
                                <h3 class="font-bold text-purple-700 border-b pb-2 mb-3 mt-6">Verse-by-Verse Commentary</h3>
                                ${s.verse_by_verse_commentary.map(v => `<div class="mb-3"><p class="font-semibold text-purple-700 mb-1">${v.verse}</p><p class="text-gray-700 text-sm">${v.commentary}</p></div>`).join('')}
                            ` : ''}

                            ${s.conclusion ? `<h3 class="font-bold text-purple-700 border-b pb-2 mb-3 mt-6">Conclusion</h3><p class="text-gray-700 leading-relaxed mb-6">${s.conclusion}</p>` : ''}

                            // waiting they were anxious about whether it worked. Now the
                            // sermon is in front of them and they can see what it's worth.
                            //
                            // Only offer what they DON'T already have. Suggesting a small
                            // group guide to someone whose package already produced one
                            // reads as not paying attention, and it invites them to pay
                            // twice for the same thing.
                            const candidates = ['Small Group Guide', 'Discussion Questions', 'Social Posts', 'Blog Article'];

                            const owned = {};
                            (p.selected_addons || []).forEach(a => { owned[a] = true; });
                            (p.addon_results || []).forEach(a => { if (a && a.addon_type) owned[a.addon_type] = true; });

                            // The sermon itself may already contain the material, which
                            // counts as having it just as much as buying it separately.
                            if ((s.discussion_questions || []).length > 0) owned['Discussion Questions'] = true;

                            const bundle = candidates.filter(a => !owned[a]);
                            if (bundle.length === 0) return '';

                            const fullPrice = bundle.reduce((sum, a) => sum + (ALL_ADDON_PRICES[a] || 0), 0);
                            if (fullPrice <= 0) return '';
                            const offerPrice = Math.ceil(fullPrice * 0.6);
                            if (app.user.credits < offerPrice) return '';

                            const names = bundle.length === 1
                                ? bundle[0].toLowerCase()
                                : bundle.slice(0, -1).map(x => x.toLowerCase()).join(', ') + ' and ' + bundle[bundle.length - 1].toLowerCase();
                            const heading = bundle.length === candidates.length
                                ? 'Get more from this sermon'
                                : 'Add what this sermon doesn\'t include yet';
                            const buttonText = bundle.length === 1
                                ? 'Add it \u2014 ' + offerPrice + ' credits'
                                : 'Add all ' + bundle.length + ' \u2014 ' + offerPrice + ' credits';

                            return '<div class="mt-6 bg-purple-50 border border-purple-200 rounded-2xl p-6">'

                                + '<div class="flex-1 min-w-[240px]">'

                                + '<p class="text-sm text-gray-700 mb-2">Turn it into ' + names + ' \u2014 ' + (bundle.length === 1 ? 'for ' : 'all ' + bundle.length + ' for ') + offerPrice + ' credits instead of ' + fullPrice + '.</p>'
                                + '<p class="text-xs text-gray-500">You have ' + app.user.credits + ' credits.</p>'
                                + '</div>'
                                + '<button onclick="orderFollowUpBundle(' + JSON.stringify(JSON.stringify(bundle)).replace(/"/g, '&quot;') + ')" class="bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-purple-700 whitespace-nowrap">' + buttonText + '</button>'
                                + '</div></div>';
                        })()}

        async function redeemPromoCode() {

                codeInput.value = '';

        async function submitContactForm() {
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const message = document.getElementById('contact-message').value;
            const honeypot = document.getElementById('contact-website');

                trackEvent('honeypot_triggered', { page: 'support' });

                render();
                return;

            try {
                const res = await gtFetch(CONTACT_FORM_WEBHOOK_URL, { name, email, message });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                document.getElementById('contact-name').value = '';
                document.getElementById('contact-email').value = '';
                document.getElementById('contact-message').value = '';
                setFlash('success', "Message sent — we'll get back to you within 24 hours.");
            } catch (err) {
                setFlash('error', "Couldn't send your message (" + err.message + "). Please try again or email support@gracetools.com directly.");

            render();
