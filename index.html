    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Remap Tailwind's default 'purple' palette to a deep ink-navy scale.
        // This is the single highest-leverage change: every existing
        // bg-purple-600 / text-purple-700 / border-purple-* class across the
        // whole app (149 instances) now renders the new brand color, with
        // zero risk of missing an instance across ~1600 lines.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#EEF1F7',
                            100: '#DCE3EF',
                            200: '#B9C7DF',
                            300: '#93A9CB',
                            400: '#5C7099',
                            500: '#3D5079',
                            600: '#2C3E63',
                            700: '#223050',
                            800: '#1A2540',
                            900: '#131C30'
                        },
                        gray: {
                            50: '#FAF8F3'
                        }
                    },
                    fontFamily: {
                        serif: ['"Source Serif 4"', 'Georgia', 'serif'],
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #FAF8F3; }
        h1, h2, h3 { font-family: 'Source Serif 4', Georgia, serif; letter-spacing: -0.01em; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .verse-ribbon { border-left: 3px solid #B4924C; padding-left: 1rem; font-family: 'Source Serif 4', Georgia, serif; font-style: italic; }

        @media (prefers-reduced-motion: no-preference) {
            .hero-enter { animation: heroEnter 0.7s ease-out both; }
            .hero-enter-delay-1 { animation: heroEnter 0.7s ease-out 0.12s both; }

            @keyframes heroEnter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

            .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }

            .lift-card { transition: transform 0.25s ease-out, box-shadow 0.25s ease-out; }

            .lift-btn { transition: transform 0.15s ease-out, box-shadow 0.15s ease-out; }
            .lift-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 16px -6px rgba(44, 62, 99, 0.35); }
        }
        @media (prefers-reduced-motion: reduce) {
            .hero-enter, .hero-enter-delay-1, .hero-enter-delay-2, .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>

    <script>
        // State Management
        const app = {
            currentPage: 'home',
            isLoggedIn: localStorage.getItem('isLoggedIn') === 'true',
            user: localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : { name: 'Pastor John', email: 'pastor@church.com', church: 'Grace Baptist', credits: 1250 },
            sermonState: {
                package: 'essentials',
                duration: 30,
                addons: [],
                inputType: 'passage',
                inputContent: '',
                translation: 'KJV',
                audience: 'Sunday Morning - Mixed',
                doctrinalPosition: 'Mid-Acts Dispensational',
                readingLevel: 'Standard',
                citationMode: 'Reference Only'
            },
            flash: null
        };

        const packagePrices = { essentials: 15, preacher: 35, master: 65 };
        const addonPrices = { 'Youth Version': 8, 'Small Group Guide': 10, 'Blog Article': 6, 'Social Posts': 5, 'Discussion Questions': 7, 'Printable': 5 };
        const youtubeAddonPrices = { 'YouTube Title & Thumbnail': 5, 'YouTube Description': 4, 'YouTube Tags': 2, 'YouTube Chapters': 4, 'YouTube Hook': 3 };
        const FACT_CHECKER_PRICE = 8;
        const ALL_ADDON_PRICES = { ...addonPrices, ...youtubeAddonPrices, 'Fact Checker': FACT_CHECKER_PRICE };

        const inputTypes = [
            { key: 'passage', label: 'Bible Passage', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'topic', label: 'Topic', placeholder: 'e.g. Walking in grace during suffering' },
            { key: 'notes', label: 'My Notes', placeholder: 'Paste your rough notes or outline here...' },
            { key: 'youtube', label: 'YouTube Link', placeholder: 'https://youtube.com/watch?v=...' },
            { key: 'pdf', label: 'Upload PDF', placeholder: '' },
            { key: 'audio', label: 'Upload Audio', placeholder: '' }
        ];
        const translations = ['KJV', 'NASB', 'NKJV', 'ESV', 'NIV'];
        const audiences = ['Sunday Morning - Mixed', 'Youth Service', 'Small Group / Bible Study', 'Funeral / Memorial', 'Wedding', "Men's / Women's Ministry"];
        const doctrinalPositions = ['Mid-Acts Dispensational', 'Baptist', 'Reformed / Calvinist', 'Wesleyan / Arminian', 'Pentecostal / Charismatic', 'Non-Denominational / Evangelical'];
        const readingLevels = ['Simple / Accessible', 'Standard', 'Scholarly / Academic'];
        const citationModes = ['Reference Only', 'Full Verse Text'];
        const packageRecommendedDuration = { essentials: [15, 30], preacher: [30, 45, 60], master: [45, 60, 90] };
        const packageRecommendedAddons = {
            essentials: ['Discussion Questions', 'Printable'],
            preacher: ['Discussion Questions', 'Printable', 'Small Group Guide', 'Blog Article'],
            master: ['Youth Version', 'Small Group Guide', 'Blog Article', 'Social Posts', 'Discussion Questions', 'Printable']
        };

        // Set this once your AnythingLLM instance is deployed and white-labeled
        // (e.g. on Railway). Leave as null until then - the nav link will show
        // a friendly "coming soon" message instead of a broken link.
        const ANYTHINGLLM_URL = null; // e.g. 'https://sermon-library.gracetools.com'

        function openSermonLibrary() {
            if (!ANYTHINGLLM_URL) {
                setFlash('info', 'Sermon Library is being set up \u2014 check back soon!');
                render();
                return;
            }
            window.open(ANYTHINGLLM_URL, '_blank');
        }

        // Navigation
        const TRACK_EVENT_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/f00aef88-9492-457c-9087-19bf173debe6/track-event';

        function trackEvent(action, extra) {
            // Fire-and-forget - never let analytics failures affect the user experience
            try {
                fetch(TRACK_EVENT_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ action, user_id: localStorage.getItem('userId') || null, ...extra })
                }).catch(() => {});
            } catch (e) {}
        }

        // Capture real client-side JS errors so we actually find out when
        // something breaks for a real user, instead of hearing about it secondhand.
        window.onerror = function (message, source, lineno, colno, error) {
            trackEvent('js_error', {
                page: app.currentPage,
                error_message: String(message),
                error_stack: error && error.stack ? error.stack : (source + ':' + lineno + ':' + colno)
            });
            return false;
        };
        window.addEventListener('unhandledrejection', function (event) {
            trackEvent('js_error', {
                page: app.currentPage,
                error_message: 'Unhandled promise rejection: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)),
                error_stack: event.reason && event.reason.stack ? event.reason.stack : ''
            });
        });

        const PAGE_TITLES = {
            home: 'GraceTools - AI Sermon Prep for Pastors',
            signup: 'Create Account - GraceTools',
            login: 'Sign In - GraceTools',
            dashboard: 'Dashboard - GraceTools',
            builder: 'Build a Sermon - GraceTools',
            pricing: 'Pricing - GraceTools',
            'quick-tools': 'Quick Tools - GraceTools',
            'how-it-works': 'How It Works - GraceTools',
            support: 'Support - GraceTools',
            faq: 'FAQ - GraceTools',
            about: 'About - GraceTools',
            terms: 'Terms of Service - GraceTools',
            privacy: 'Privacy Policy - GraceTools',
            legal: 'Legal Notices - GraceTools',
            account: 'Account Settings - GraceTools'
        };

        function goTo(page) {
            app.currentPage = page;
            window.scrollTo(0, 0);
            document.title = PAGE_TITLES[page] || 'GraceTools';
            render();
            trackEvent('pageview', { page });
            if (page === 'dashboard' && app.isLoggedIn) {
                loadProjects();
            }
        }

        // Flash messages survive exactly one render (including through a goTo
        // that immediately follows setFlash), then clear themselves on the
        // next render so they don't linger across unrelated navigation.
        function setFlash(type, text) {
            app.flash = { type, text, shown: false };
        }

        // Every account, real or returning, is created/looked-up through this
        // one webhook, which upserts into the real Supabase users table and
        // always returns the canonical row (real id + real credits_balance).
        // This is what completeCheckout's credit deduction depends on.
        const CREATE_USER_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/0f43fdcb-2707-4796-9a7e-312f11e44f73/create-user';

        // Shared key required by every GraceTools webhook. Note: since this
        // ships in client-side JS, a determined attacker could still extract
        // it from the page source - this stops casual scraping/enumeration
        // but is not a substitute for real per-user session authentication.
        const GRACETOOLS_API_KEY = 'WtESSNN3F8YgGRLcwn0I3-UpOUFSgu_h97w2gJ-hLdU';

        function applyAccountFromServer(serverUser, fallbackName, fallbackChurch) {
            app.user = {
                name: serverUser.display_name || fallbackName || app.user.name,
                email: serverUser.email,
                church: serverUser.church_name || fallbackChurch || app.user.church,
                credits: typeof serverUser.credits_balance === 'number' ? serverUser.credits_balance : 0
            };
            app.isLoggedIn = true;
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('user', JSON.stringify(app.user));
            localStorage.setItem('userId', serverUser.id);
        }

        async function handleSignup() {
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const church = document.getElementById('signup-church').value;

            // Honeypot: real users never see or fill this field; bots often do.
            const honeypot = document.getElementById('signup-website');
            if (honeypot && honeypot.value) {
                trackEvent('honeypot_triggered', { page: 'signup' });
                setFlash('error', "Couldn't create your account. Please try again.");
                render();
                return;
            }

            // Note: this creates the real account record (name, email, church,
            // credits) in Supabase. It does not yet verify passwords against a
            // real auth provider - that still needs Supabase Auth wired in.
            try {
                const res = await fetch(CREATE_USER_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ user_id: ensureUserId(), email, name, church, starting_credits: 0 })
                });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                const data = await res.json();
                applyAccountFromServer(data.user, name, church);
                goTo('dashboard');
            } catch (err) {
                setFlash('error', "Couldn't create your account (" + err.message + "). Please try again.");
                render();
            }
        }

        async function handleLoginSubmit() {
            const email = document.getElementById('login-email').value;
            // Same real webhook, looked up by email. This restores your real
            // name, church, and credit balance from Supabase. It does not yet
            // verify the password field against a real auth provider.
            try {
                const res = await fetch(CREATE_USER_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ user_id: ensureUserId(), email })
                });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                const data = await res.json();
                applyAccountFromServer(data.user, app.user.name, app.user.church);
                goTo('dashboard');
            } catch (err) {
                setFlash('error', "Couldn't sign you in (" + err.message + "). Please try again.");
                render();
            }
        }

        function handleLogout() {
            app.isLoggedIn = false;
            localStorage.removeItem('isLoggedIn');
            goTo('home');
        }

        function getSermonTotal() {
            let total = packagePrices[app.sermonState.package];
            app.sermonState.addons.forEach(addon => { total += ALL_ADDON_PRICES[addon] || 0; });
            return total;
        }

        function fillExample() {
            app.sermonState.inputType = 'passage';
            app.sermonState.inputContent = 'Romans 8:1-4';
            render();
        }

        function updateInputContent(value) {
            app.sermonState.inputContent = value.slice(0, 5000);
            const counter = document.getElementById('input-char-count');
            if (counter) counter.textContent = app.sermonState.inputContent.length + '/5000';
        }

        // This is the ONLY place user_email is read from for sermon delivery -
        // always the account's email (set at signup, editable on Account page),
        // never anything typed elsewhere. This guarantees the finished sermon
        // is always emailed to whatever address the customer has on file.
        const SERMON_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/gracetools-sermon-gen/generate-sermon';
        const EXTRACT_PDF_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/a6c80bd3-d08a-4a6a-b4d8-1374aebc7699/extract-pdf';
        const TRANSCRIBE_AUDIO_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/ae6e2a46-e139-42c5-bc27-e1c6fd457a11/transcribe-audio';

        app.uploadState = { uploading: false, error: null, fileName: null };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handlePdfUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 8 * 1024 * 1024) {
                setFlash('error', 'PDF is too large - please upload a file under 8MB.');
                render();
                return;
            }
            app.uploadState = { uploading: true, error: null, fileName: file.name };
            render();
            try {
                const base64 = await fileToBase64(file);
                const res = await fetch(EXTRACT_PDF_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ pdf_base64: base64, filename: file.name, user_email: app.user.email })
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 150) : ''));
                }
                const data = await res.json();
                if (!data.extracted_text || !data.extracted_text.trim()) {
                    throw new Error('No text could be extracted from this PDF - it may be a scanned image without real text.');
                }
                app.sermonState.inputContent = data.extracted_text.slice(0, 5000);
                app.uploadState = { uploading: false, error: null, fileName: file.name };
                setFlash('success', 'Extracted ' + data.extracted_text.split(' ').length + ' words from "' + file.name + '".');
            } catch (err) {
                app.uploadState = { uploading: false, error: err.message, fileName: null };
                setFlash('error', "Couldn't process that PDF (" + err.message + ").");
            }
            render();
        }

        async function handleAudioUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.size > 20 * 1024 * 1024) {
                setFlash('error', 'Audio file is too large - please upload a file under 20MB.');
                render();
                return;
            }
            app.uploadState = { uploading: true, error: null, fileName: file.name };
            render();
            try {
                const base64 = await fileToBase64(file);
                const res = await fetch(TRANSCRIBE_AUDIO_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ audio_base64: base64, filename: file.name, user_email: app.user.email, project_id: null })
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 150) : ''));
                }
                const data = await res.json();
                if (!data.transcription || !data.transcription.trim()) {
                    throw new Error('No speech could be transcribed from this file.');
                }
                app.sermonState.inputContent = data.transcription.slice(0, 5000);
                app.uploadState = { uploading: false, error: null, fileName: file.name };
                setFlash('success', 'Transcribed ' + data.word_count + ' words from "' + file.name + '".');
            } catch (err) {
                app.uploadState = { uploading: false, error: err.message, fileName: null };
                setFlash('error', "Couldn't transcribe that audio (" + err.message + ").");
            }
            render();
        }

        function ensureUserId() {
            let id = localStorage.getItem('userId');
            if (!id) {
                id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('temp-' + Date.now());
                localStorage.setItem('userId', id);
            }
            return id;
        }

        async function completeCheckout() {
            const total = getSermonTotal();
            if (app.user.credits < total) {
                setFlash('error', "You don't have enough credits for this package. Buy more credits to continue.");
                render();
                return;
            }

            const destinationEmail = app.user.email; // account email, explicitly

            const payload = {
                user_id: ensureUserId(),
                user_email: destinationEmail,
                project_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('proj-' + Date.now()),
                input_type: app.sermonState.inputType,
                input_content: app.sermonState.inputContent || 'Romans 8:1-4',
                base_package: app.sermonState.package,
                credits_cost: total,
                doctrinal_position: app.sermonState.doctrinalPosition,
                bible_translation: app.sermonState.translation,
                audience: app.sermonState.audience,
                sermon_style: 'Expository (Verse-by-Verse)',
                desired_length: app.sermonState.duration,
                reading_level: app.sermonState.readingLevel,
                citation_mode: app.sermonState.citationMode,
                addons: app.sermonState.addons
            };

            setFlash('info', 'Submitting your sermon \u2014 it will be generated and emailed to ' + destinationEmail + '. This usually takes 30-90 seconds.');
            render();

            try {
                const res = await fetch(SERMON_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 200) : ''));
                }
                app.user.credits -= total;
                localStorage.setItem('user', JSON.stringify(app.user));
                setFlash('success', 'Your sermon is generating now and will be emailed to ' + destinationEmail + ' shortly.');
            } catch (err) {
                setFlash('error', "Your sermon couldn't be submitted (" + err.message + "). Your credits were NOT charged \u2014 please try again or contact support@gracetools.com.");
            }
            goTo('dashboard');
        }

        function saveAccount() {
            const name = document.getElementById('acct-name').value;
            const email = document.getElementById('acct-email').value;
            const church = document.getElementById('acct-church').value;
            app.user.name = name;
            app.user.email = email;
            app.user.church = church;
            localStorage.setItem('user', JSON.stringify(app.user));
            setFlash('success', 'Your account changes were saved.');
            goTo('account');
        }

        function buyCredits(credits) {
            setFlash('info', 'Live payments aren\'t connected yet, so this is a placeholder \u2014 buying ' + credits + ' credits will work once Stripe billing goes live.');
            render();
        }

        function sendPasswordReset() {
            const email = document.getElementById('reset-email') ? document.getElementById('reset-email').value : '';
            setFlash('success', email ? ("If an account exists for " + email + ", reset instructions are on the way.") : 'Enter your email above and we\'ll send reset instructions.');
            render();
        }

        const LIST_PROJECTS_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/6fe57b4e-bb9f-4049-b6b8-ceb56cad70e0/list-projects';

        // Real project data, replacing the old hardcoded mockProjects.
        // null = not yet loaded, [] = loaded but empty, [...] = loaded with data
        app.projects = null;
        app.viewingProject = null;
        app.quickTools = { selectedTool: 'sermon_title', inputContent: '', result: null, loading: false };
        app.faqOpen = null;

        const QUICK_TOOLS_WEBHOOK_URL = 'https://indefinable-teal.pikapod.net/webhook/56052e96-4e99-4abe-aa3a-9c15e7d71a51/quick-tools';
        const QUICK_TOOL_PRICE = 2;
        const QUICK_TOOLS = [
            { key: 'sermon_title', label: 'Sermon Title Generator', category: 'Sermon Building', placeholder: 'e.g. Romans 8:1-4 or "walking by faith"' },
            { key: 'big_idea', label: 'Big Idea Generator', category: 'Sermon Building', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'introduction', label: 'Introduction Generator', category: 'Sermon Building', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'conclusion', label: 'Conclusion Generator', category: 'Sermon Building', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'closing_prayer', label: 'Closing Prayer Generator', category: 'Sermon Building', placeholder: 'e.g. Romans 8:1-4' },
            { key: 'verse_explanation', label: 'Verse Explanation', category: 'Bible Study', placeholder: 'e.g. John 3:16' },
            { key: 'chapter_summary', label: 'Chapter Summary', category: 'Bible Study', placeholder: 'e.g. Romans 8' },
            { key: 'book_overview', label: 'Book Overview', category: 'Bible Study', placeholder: 'e.g. Romans' },
            { key: 'cross_reference', label: 'Cross-Reference Finder', category: 'Bible Study', placeholder: 'e.g. Romans 8:1' },
            { key: 'word_study', label: 'Greek & Hebrew Word Study', category: 'Bible Study', placeholder: 'e.g. "agape" in John 3:16' },
            { key: 'bible_timeline', label: 'Bible Timeline', category: 'Bible Study', placeholder: 'e.g. The life of Moses' },
            { key: 'doctrine_explorer', label: 'Doctrine Explorer', category: 'Research', placeholder: 'e.g. Justification by Faith' },
            { key: 'illustration_finder', label: 'Sermon Illustration Finder', category: 'Research', placeholder: "e.g. God's faithfulness in trials" },

        function renderQuickToolResult(result) {
            if (!result) return '';
            if (result.raw_text) return `<p class="text-gray-700 whitespace-pre-line">${result.raw_text}</p>`;
            let html = '';
            for (const [key, value] of Object.entries(result)) {
                const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                if (Array.isArray(value)) {
                    html += `<div class="mb-4"><p class="text-xs font-bold text-purple-700 uppercase tracking-wide mb-2">${label}</p>`;
                    if (value.length && typeof value[0] === 'object') {
                        html += value.map(item => `<div class="mb-2 p-3 bg-gray-50 rounded-lg border border-gray-200">${Object.entries(item).map(([k, v]) => `<p class="text-sm"><span class="font-semibold text-gray-900">${k.replace(/_/g, ' ')}:</span> <span class="text-gray-700">${v}</span></p>`).join('')}</div>`).join('');
                    } else {
                        html += `<ul class="list-disc pl-5 text-gray-700 space-y-1">${value.map(v => `<li>${v}</li>`).join('')}</ul>`;
                    }
                    html += `</div>`;
                } else if (typeof value === 'object' && value !== null) {
                    html += `<div class="mb-4"><p class="text-xs font-bold text-purple-700 uppercase tracking-wide mb-2">${label}</p><div class="p-3 bg-gray-50 rounded-lg border border-gray-200">${Object.entries(value).map(([k, v]) => `<p class="text-sm"><span class="font-semibold text-gray-900">${k.replace(/_/g, ' ')}:</span> <span class="text-gray-700">${v}</span></p>`).join('')}</div></div>`;
                } else {
                    html += `<div class="mb-4"><p class="text-xs font-bold text-purple-700 uppercase tracking-wide mb-2">${label}</p><p class="text-gray-700 leading-relaxed">${value}</p></div>`;
                }
            }
            return html;
        }

        async function submitQuickTool() {
            if (!app.quickTools.inputContent || !app.quickTools.inputContent.trim()) {
                setFlash('error', 'Please enter something for the tool to work from.');
                render();
                return;
            }
            if (app.user.credits < QUICK_TOOL_PRICE) {
                setFlash('error', "You don't have enough credits for this. Buy more credits to continue.");
                render();
                return;
            }
            app.quickTools.loading = true;
            render();
            try {
                const res = await fetch(QUICK_TOOLS_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({
                        tool_type: app.quickTools.selectedTool,
                        input_content: app.quickTools.inputContent,
                        user_id: ensureUserId(),
                        user_email: app.user.email,
                        bible_translation: app.sermonState.translation,
                        doctrinal_position: app.sermonState.doctrinalPosition
                    })
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    throw new Error('Server responded with ' + res.status + (errText ? ': ' + errText.slice(0, 150) : ''));
                }
                const data = await res.json();
                app.quickTools.result = data.result;
                app.user.credits -= QUICK_TOOL_PRICE;
                localStorage.setItem('user', JSON.stringify(app.user));
            } catch (err) {
                app.quickTools.loading = false;
                setFlash('error', "Couldn't generate that (" + err.message + ").");
                render();
                return;
            }
            app.quickTools.loading = false;
            render();
        }

        async function loadProjects() {
            try {

            render();

        // While any project is still generating, quietly refresh every 10s
        // so the dashboard updates without a manual reload.
        function manageProjectPolling() {
            const hasGenerating = (app.projects || []).some(p => p.status === 'generating' || p.status === 'pending');
            if (hasGenerating && !pollTimer) {
                pollTimer = setInterval(loadProjects, 10000);
            } else if (!hasGenerating && pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        function viewProject(id) {
            const p = (app.projects || []).find(pr => pr.id === id);

            if (p.status === 'ready') {

                goTo('sermon-viewer');

                setFlash('error', (p.title ? '"' + p.title + '"' : 'This sermon') + ' failed to generate: ' + (p.error_message || 'unknown error') + '. Your credits were automatically refunded.');

            }
        }

        async function submitContactForm() {
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const message = document.getElementById('contact-message').value;
            const honeypot = document.getElementById('contact-website');

            if (!name || !email || !message) {
                setFlash('error', 'Please fill in all fields.');
                render();
                return;
            }
            if (honeypot && honeypot.value) {
                trackEvent('honeypot_triggered', { page: 'support' });
                setFlash('error', "Couldn't send your message. Please try again.");
                render();
                return;
            }

            try {
                const res = await fetch(CONTACT_FORM_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-GraceTools-Key': GRACETOOLS_API_KEY },
                    body: JSON.stringify({ name, email, message })
                });
                if (!res.ok) throw new Error('Server responded with ' + res.status);
                document.getElementById('contact-name').value = '';
                document.getElementById('contact-email').value = '';
                document.getElementById('contact-message').value = '';
                setFlash('success', "Message sent — we'll get back to you within 24 hours.");
            } catch (err) {
                setFlash('error', "Couldn't send your message (" + err.message + "). Please try again or email support@gracetools.com directly.");
            }
            render();
        }

                { q: 'What Bible translations are supported?', a: 'KJV, NASB, NKJV, ESV, and NIV are currently available in the builder.' },
                { q: 'Can I control how AI quotes Scripture?', a: 'Yes — choose "Reference Only" (just the verse address) or "Full Verse Text" (the complete quoted text) in the builder.' },
                { q: 'How long does generation take?', a: 'Most sermons generate and arrive by email within 30-90 seconds.' },
                { q: 'Is my data private?', a: "See our Privacy Policy for full details — in short, your content is used to generate your sermon and is not shared publicly." },
                { q: "What's the difference between Essentials, Preacher, and Master packages?", a: 'Essentials includes a title, big idea, main points, and key takeaways. Preacher adds a full introduction, historical/cultural background, cross-references, and conclusion. Master adds verse-by-verse commentary, character studies, a children\'s message, and discussion questions.' }
            ];
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-4xl font-bold text-gray-900 mb-8">Frequently Asked Questions</h1>
                        <div class="space-y-4">
                            ${faqs.map((f, i) => `
                                <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                                    <button onclick="app.faqOpen = app.faqOpen === ${i} ? null : ${i}; render();" class="w-full text-left px-6 py-4 flex items-center justify-between">
                                        <span class="font-semibold text-gray-900">${f.q}</span>
                                        <span class="text-purple-600 text-xl">${app.faqOpen === i ? '\u2212' : '+'}</span>
                                    </button>
                                    ${app.faqOpen === i ? `<div class="px-6 pb-4 text-gray-600 text-sm leading-relaxed">${f.a}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-center text-gray-600 text-sm mt-8">Still have questions? <button type="button" onclick="goTo('support')" class="text-purple-600 hover:underline font-semibold cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Contact us</button></p>
                    </div>
                </div>
            `;
        }

        function NotFoundPage() {
            trackEvent('page_not_found', { page: app.currentPage });
            return `
                <div class="pt-20 min-h-screen bg-gray-50 px-6 py-12 flex items-center justify-center">
                    <div class="max-w-md mx-auto text-center">
                        <p class="text-6xl mb-4">\ud83e\udded</p>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Page Not Found</h1>
                        <p class="text-gray-600 mb-8">We couldn't find what you were looking for. It may have moved, or the link might be out of date.</p>
                        <button onclick="goTo('home')" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700">Back to Home</button>
                    </div>
                </div>
            `;
        }

        // Render
        function initScrollReveal() {
            if (!('IntersectionObserver' in window)) return;
            const els = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15 });
            els.forEach(el => observer.observe(el));
        }

        function render() {
            let content = '';
            
            if (app.currentPage === 'home') content = HomePage();
            else if (app.currentPage === 'signup') content = app.isLoggedIn ? '' : SignupPage();
            else if (app.currentPage === 'login') content = app.isLoggedIn ? '' : LoginPage();
            else if (app.currentPage === 'forgot-password') content = ForgotPasswordPage();
            else if (app.currentPage === 'dashboard') content = app.isLoggedIn ? DashboardPage() : HomePage();
            else if (app.currentPage === 'sermon-viewer') content = app.isLoggedIn ? SermonViewerPage() : HomePage();
            else if (app.currentPage === 'quick-tools') content = app.isLoggedIn ? QuickToolsPage() : HomePage();
            else if (app.currentPage === 'pricing') content = PricingPage();
            else if (app.currentPage === 'builder') content = app.isLoggedIn ? BuilderPage() : SignupPage();
            else if (app.currentPage === 'about') content = PricingPageComplete();
            else if (app.currentPage === 'terms') content = TermsPage();
            else if (app.currentPage === 'privacy') content = PrivacyPage();
            else if (app.currentPage === 'legal') content = LegalPage();
            else if (app.currentPage === 'account') content = app.isLoggedIn ? AccountPage() : HomePage();
            else if (app.currentPage === 'checkout') content = app.isLoggedIn ? CheckoutPage() : HomePage();
            else if (app.currentPage === 'how-it-works') content = `<div class="pt-20 min-h-screen bg-gray-50 px-6 py-12"><div class="max-w-4xl mx-auto"><h1 class="text-4xl font-bold mb-8">How It Works</h1><div class="bg-white rounded-2xl border p-8"><p class="text-gray-600 mb-4">1. Choose a package (Essentials, Preacher, or Master Sermon)</p><p class="text-gray-600 mb-4">2. Provide your input (passage, topic, notes, or YouTube link)</p><p class="text-gray-600 mb-4">3. Configure your settings (theology, translation, audience, length)</p><p class="text-gray-600 mb-4">4. Add optional features (discussion guides, social posts, etc.)</p><p class="text-gray-600 mb-4">5. Checkout with credits (they never expire)</p><p class="text-gray-600">6. AI generates your complete sermon in 5-10 minutes</p></div></div></div>`;
            else if (app.currentPage === 'support') content = SupportPage();
            else if (app.currentPage === 'faq') content = FAQPage();
            else content = NotFoundPage();

            document.getElementById('app').innerHTML = Header() + FlashBanner() + content + `
                <footer class="bg-white border-t border-gray-200 px-6 py-8 mt-12">
                    <div class="max-w-7xl mx-auto text-center text-sm text-gray-600">
                        <div class="mb-4 space-x-4">
                            <button type="button" onclick="goTo('legal')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Legal</button>
                            <button type="button" onclick="goTo('terms')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Terms</button>
                            <button type="button" onclick="goTo('privacy')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Privacy</button>
                            <button type="button" onclick="goTo('support')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">Support</button>
                            <button type="button" onclick="goTo('faq')" class="hover:text-gray-900 cursor-pointer bg-transparent border-0 p-0 inline align-baseline">FAQ</button>
                        </div>
                        <p>© 2024 GraceTools. Built for pastors.</p>
                    </div>
                </footer>
            `;
            initScrollReveal();
        }

        // Init
        render();
    </script>
</body>
</html>
